[platformio]
default_envs = cyd_optimized_input_aligned

[env:cyd_ili9341]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_size = 4MB
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:patch_jpegdec.py
lib_ignore = bb_spi_lcd
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bitbank2/JPEGDEC@1.8.5
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -Wall
    -Wextra
    -include include/jpeg_portable.hpp
    -DUSER_SETUP_LOADED
    -DILI9341_2_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DUSE_HSPI_PORT
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=10000000

; Experimental comparison build. Clock defaults remain conservative; select
; higher TFT rates explicitly through the benchmark command after inspection.
[env:cyd_performance]
extends = env:cyd_ili9341
build_unflags = -Os
build_flags =
    ${env:cyd_ili9341.build_flags}
    -O3

[env:cyd_uart_460800]
extends = env:cyd_performance
monitor_speed = 460800
build_flags =
    ${env:cyd_performance.build_flags}
    -DMVB_UART_BAUD=460800

[env:cyd_uart_921600]
extends = env:cyd_performance
monitor_speed = 921600
build_flags =
    ${env:cyd_performance.build_flags}
    -DMVB_UART_BAUD=921600

; Measured against cyd_performance before selecting production defaults.
[env:cyd_pipeline]
extends = env:cyd_performance
build_flags =
    ${env:cyd_performance.build_flags}
    -DMVB_USE_ROM_CRC
    -DMVB_SD_SEEK_CACHE

[env:cyd_pipeline_strips]
extends = env:cyd_pipeline
build_flags =
    ${env:cyd_pipeline.build_flags}
    -DMVB_JPEG_MAX_BUFFERED_PIXELS=5120

[env:cyd_pipeline_no_psram]
extends = env:cyd_pipeline_strips
build_flags =
    ${env:cyd_pipeline_strips.build_flags}
    -mno-fix-esp32-psram-cache-issue

[env:cyd_sd_buffered]
extends = env:cyd_pipeline
build_flags =
    ${env:cyd_pipeline.build_flags}
    -DMVB_STDIO_READ_BUFFER_BYTES=8192

[env:cyd_sd_buffered_strips]
extends = env:cyd_pipeline_strips
build_flags =
    ${env:cyd_pipeline_strips.build_flags}
    -DMVB_STDIO_READ_BUFFER_BYTES=8192

[env:cyd_sd_posix]
extends = env:cyd_pipeline
build_flags =
    ${env:cyd_pipeline.build_flags}
    -DMVB_SD_POSIX_READ

[env:cyd_sd_posix_strips]
extends = env:cyd_pipeline_strips
build_flags =
    ${env:cyd_pipeline_strips.build_flags}
    -DMVB_SD_POSIX_READ

[env:cyd_record]
extends = env:cyd_sd_posix_strips
build_flags =
    ${env:cyd_sd_posix_strips.build_flags}
    -DMVB_FRAME_RECORD_READ

[env:cyd_record_no_psram]
extends = env:cyd_record
build_flags =
    ${env:cyd_record.build_flags}
    -mno-fix-esp32-psram-cache-issue

[env:cyd_decoders]
extends = env:cyd_record
build_flags =
    ${env:cyd_record.build_flags}
    -DMVB_ENABLE_TJPGD_FAST
    -DMVB_ENABLE_NEW_JPEG
    -Lvendor/esp_new_jpeg/lib/esp32
    -lesp_new_jpeg

[env:cyd_decoders_no_psram]
extends = env:cyd_decoders
build_flags =
    ${env:cyd_decoders.build_flags}
    -mno-fix-esp32-psram-cache-issue

; Bounded compressed read-ahead is opt-in at runtime for the measured CYD.
; Application UART speed differs from the retained 115200 ROM flasher speed.
[env:cyd_prefetch]
extends = env:cyd_decoders_no_psram
build_flags =
    ${env:cyd_decoders_no_psram.build_flags}
    -DMVB_FRAME_PREFETCH

[env:cyd_prefetch_uart_2000000]
extends = env:cyd_prefetch
monitor_speed = 2000000
build_flags =
    ${env:cyd_prefetch.build_flags}
    -DMVB_UART_BAUD=2000000

[env:cyd_idf_sd_uart_2000000]
extends = env:cyd_prefetch_uart_2000000
build_flags =
    ${env:cyd_prefetch_uart_2000000.build_flags}
    -DMVB_USE_IDF_SDSPI

[env:cyd_idf_sd_dma2_uart_2000000]
extends = env:cyd_idf_sd_uart_2000000
build_flags =
    ${env:cyd_idf_sd_uart_2000000.build_flags}
    -DMVB_DMA_QUEUE_DEPTH=2

[env:cyd_idf_sd_uart_921600]
extends = env:cyd_prefetch
monitor_speed = 921600
build_flags =
    ${env:cyd_prefetch.build_flags}
    -DMVB_USE_IDF_SDSPI
    -DMVB_UART_BAUD=921600

[env:cyd_idf_sd_dma2_uart_921600]
extends = env:cyd_idf_sd_uart_921600
build_flags =
    ${env:cyd_idf_sd_uart_921600.build_flags}
    -DMVB_DMA_QUEUE_DEPTH=2

[env:cyd_prefetch_dma2_uart_921600]
extends = env:cyd_prefetch
monitor_speed = 921600
build_flags =
    ${env:cyd_prefetch.build_flags}
    -DMVB_DMA_QUEUE_DEPTH=2
    -DMVB_UART_BAUD=921600

[env:cyd_prefetch_dma2_adaptive_uart_921600]
extends = env:cyd_prefetch_dma2_uart_921600
build_flags =
    ${env:cyd_prefetch_dma2_uart_921600.build_flags}
    -DMVB_ADAPTIVE_LOOP_YIELD

[env:cyd_prefetch_dma2]
extends = env:cyd_prefetch
build_flags =
    ${env:cyd_prefetch.build_flags}
    -DMVB_DMA_QUEUE_DEPTH=2

[env:cyd_prefetch_dma2_adaptive]
extends = env:cyd_prefetch_dma2
build_flags =
    ${env:cyd_prefetch_dma2.build_flags}
    -DMVB_ADAPTIVE_LOOP_YIELD

[env:cyd_jpeg_warmup]
extends = env:cyd_prefetch_dma2_adaptive
build_flags =
    ${env:cyd_prefetch_dma2_adaptive.build_flags}
    -DMVB_JPEG_FIRST_BLOCK_WARMUP

[env:cyd_jpeg_warmup_chroma]
extends = env:cyd_jpeg_warmup
build_flags =
    ${env:cyd_jpeg_warmup.build_flags}
    -DMVB_RESEARCH_JPEG_CHROMA

; Optional two-strip lookahead comparison. Its cache and generic block loop
; are excluded entirely from the ordinary one-strip production build.
[env:cyd_jpeg_two_block_warmup]
extends = env:cyd_jpeg_warmup
build_flags =
    ${env:cyd_jpeg_warmup.build_flags}
    -DMVB_JPEG_TWO_BLOCK_WARMUP

; Qualified production defaults: three owned output strips, bounded 1s idle
; yield and one-block warmup. First-record preload remains research-only.
[env:cyd_optimized]
extends = env:cyd_jpeg_warmup
build_flags =
    ${env:cyd_jpeg_warmup.build_flags}
    -DMVB_QUALIFIED_DEFAULTS
    -DMVB_QUALIFIED_FAST_DEFAULTS
    -DMVB_JPEG_DMA_DIRECT_OUTPUT

; Three bounded codec-output strips replace the codec strip plus two staging
; strips after explicit set_render_options zero_copy=true. Default remains off.
; Exact SDK output switching and physical integrity require separate testing.
[env:cyd_jpeg_dma_direct]
extends = env:cyd_jpeg_warmup
build_flags =
    ${env:cyd_jpeg_warmup.build_flags}
    -DMVB_QUALIFIED_DEFAULTS
    -DMVB_JPEG_DMA_DIRECT_OUTPUT

; Optional first-record preparation before a fresh media clock. Runtime
; preload_first_frame remains false until explicitly enabled for comparison.
[env:cyd_jpeg_dma_direct_preload]
extends = env:cyd_jpeg_dma_direct
build_flags =
    ${env:cyd_jpeg_dma_direct.build_flags}
    -DMVB_FIRST_FRAME_PRELOAD

; Both reusable compressed records use 16-byte alignment, independent of heap
; placement after queue/media changes. This is the qualified playback variant.
[env:cyd_optimized_input_aligned]
extends = env:cyd_optimized
build_flags =
    ${env:cyd_optimized.build_flags}
    -DMVB_ALIGN_COMPRESSED_RECORDS

